<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apartment Cleaning Calendar</title>

<style>
:root{
  --bg:#111315;
  --panel:#1b1d1f;
  --panel2:#242729;
  --panel3:#303335;
  --text:#f4f1ea;
  --muted:#aaa49a;
  --line:#3a3d40;
  --accent:#78a6ff;
  --radius:18px;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(120,166,255,.14), transparent 34rem),
    radial-gradient(circle at bottom right, rgba(56,189,148,.10), transparent 30rem),
    var(--bg);
  color:var(--text);
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:min(1420px, calc(100vw - 28px));
  margin:auto;
  padding:28px 0 42px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.title h1{
  margin:0;
  font-size:clamp(2rem,4vw,3.25rem);
  line-height:.95;
  letter-spacing:-.06em;
}

.title p{
  margin:12px 0 0;
  color:var(--muted);
}

.card{
  background:rgba(27,29,31,.84);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.sync-card{
  min-width:305px;
  padding:14px;
}

.status{
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--muted);
}

.pulse{
  width:10px;
  height:10px;
  border-radius:999px;
  background:#38bd94;
  box-shadow:0 0 0 5px rgba(56,189,148,.12);
}

.share-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.share-row input{
  width:100%;
  min-width:0;
  background:#151719;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--muted);
  padding:10px 12px;
}

button{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}

button:hover{
  background:#2b2f32;
  border-color:#555b61;
}

.grid{
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:18px;
  align-items:start;
}

.card-header{
  padding:18px;
  border-bottom:1px solid var(--line);
}

.card-header h2{
  margin:0;
}

.card-header small{
  display:block;
  margin-top:8px;
  color:var(--muted);
}

.section{
  padding:18px;
}

.people-list{
  display:grid;
  gap:10px;
}

.person{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  padding:10px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
}

.dot{
  width:13px;
  height:13px;
  border-radius:999px;
  background:var(--person-color);
}

.person input{
  width:100%;
  background:transparent;
  border:0;
  color:var(--text);
  outline:0;
}

.primary-btn{
  width:100%;
  margin-top:12px;
  font-weight:800;
  background:linear-gradient(135deg, rgba(120,166,255,.34), rgba(56,189,148,.24));
  border-color:rgba(120,166,255,.45);
}

.calendar-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}

.tabs{
  display:flex;
  background:#151719;
  border:1px solid var(--line);
  border-radius:14px;
  padding:4px;
}

.tab-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 14px;
}

.tab-btn.active{
  background:var(--panel3);
  color:var(--text);
}

#dateTitle{
  font-weight:900;
  letter-spacing:-.03em;
  font-size:1.25rem;
}

.calendar-shell{
  padding:16px;
  overflow-x:auto;
}

.week-table{
  display:grid;
  grid-template-columns:140px repeat(7, minmax(85px,1fr));
  gap:6px;
  min-width:760px;
}

.corner,
.day-head,
.area-label{
  min-height:42px;
  display:flex;
  align-items:center;
  color:var(--muted);
  font-weight:800;
  font-size:.84rem;
}

.day-head{
  justify-content:center;
  text-align:center;
}

.day-head strong{
  color:var(--text);
  font-size:.95rem;
}

.area-label{
  justify-content:flex-start;
  color:var(--text);
  padding-left:4px;
}

.cell{
  min-height:58px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:border-color .15s;
}

.cell:hover{
  border-color:var(--accent);
}

.assignment{
  display:flex;
  gap:8px;
  align-items:center;
  background:rgba(0,0,0,.25);
  padding:6px 10px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:800;
}

.mini-dot{
  width:9px;
  height:9px;
  border-radius:999px;
  background:var(--person-color);
}

.month-grid{
  display:grid;
  grid-template-columns:repeat(7, minmax(135px,1fr));
  gap:10px;
  min-width:980px;
}

.month-day{
  min-height:165px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel2);
  padding:10px;
}

.month-clickable{
  width:100%;
  margin-bottom:7px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.16);
  border-radius:10px;
  padding:7px 8px;
  color:var(--muted);
  text-align:left;
  display:grid;
  grid-template-columns:9px minmax(0,1fr);
  gap:7px;
  align-items:center;
  font-size:.78rem;
  line-height:1.2;
}

.month-clickable span:last-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.month-weekday{
  text-align:center;
  color:var(--muted);
  font-weight:900;
  font-size:.8rem;
  padding-bottom:8px;
}

.span-cell{grid-column:2 / -1;gap:16px}
.cell{flex-wrap:wrap;gap:6px;padding:6px}
.pill-btn{background:none;border:0;padding:0}
.pill-btn:hover{background:none}
.span-cell .assignment{font-size:1rem;padding:9px 18px}
.done-btn{font-size:.74rem;font-weight:800;padding:6px 10px;border-radius:999px;color:var(--muted)}
.done-btn.on{background:rgba(56,189,148,.22);border-color:#38bd94;color:#7ee2c1}
.cell.is-done{border-color:#38bd94;background:rgba(56,189,148,.10)}
.cell.current,.area-label.current{border-color:var(--accent)}
.day-head.today strong{color:var(--accent)}
.month-table{display:grid;gap:6px;min-width:640px}
.hidden{
  display:none!important;
}

@media(max-width:940px){
  .grid{
    grid-template-columns:1fr;
  }

  .sync-card{
    width:100%;
  }
}

@media(max-width:690px){
  .app{
    width:min(100% - 18px,1180px);
    padding-top:16px;
  }

  .title h1{
    font-size:2.25rem;
  }

  .calendar-toolbar{
    align-items:flex-start;
  }

  #dateTitle{
    width:100%;
    order:3;
  }
}
</style>
</head>

<body>

<main class="app">

<header class="topbar">
  <div class="title">
    <h1>Cleaning Calendar</h1>
    <p>Everyone gets a different task each week, rotating in a cycle. Tap any slot to swap it.</p>
  </div>

  <aside class="card sync-card">
    <div class="status">
      <div class="pulse"></div>
      <div id="syncText">Connecting...</div>
    </div>

    <div class="share-row">
      <input id="shareLink" readonly />
      <button id="copyBtn" type="button">Copy</button>
    </div>
  </aside>
</header>

<section class="grid">

<aside class="card">
  <div class="card-header">
    <h2>Roommates</h2>
    <small>Order here sets the rotation cycle</small>
  </div>

  <div class="section">
    <div id="peopleList" class="people-list"></div>
    <button id="resetScheduleBtn" class="primary-btn" type="button" style="margin-top:18px;">↻ Re-sync Auto Cycle</button>
  </div>
</aside>

<section class="card">
  <div class="calendar-toolbar">
    <div class="tabs">
      <button id="weekTab" class="tab-btn active" type="button">Week</button>
      <button id="monthTab" class="tab-btn" type="button">Month</button>
    </div>

    <div id="dateTitle"></div>

    <div>
      <button id="prevBtn" type="button">‹</button>
      <button id="todayBtn" type="button">Today</button>
      <button id="nextBtn" type="button">›</button>
    </div>
  </div>

  <div class="calendar-shell">
    <div id="weekView"></div>
    <div id="monthView" class="hidden"></div>
  </div>
</section>

</section>

</main>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyDzlckuFw-Z7ORToYQBctEjeR4UnOQAsAs",
  authDomain: "roma-cleaning-calendar.firebaseapp.com",
  projectId: "roma-cleaning-calendar",
  storageBucket: "roma-cleaning-calendar.firebasestorage.app",
  messagingSenderId: "499659793437",
  appId: "1:499659793437:web:8d969bddd2992f1791d2f4",
  measurementId: "G-K38Q24H8RK"
};

// Fixed areas list
const FIXED_AREAS = [
  { id:"kitchen", name:"Kitchen" },
  { id:"bagno_con_vasca", name:"Bagno con vasca" },
  { id:"normale_bagno", name:"Bagno Normale" },
  { id:"common_pavimento", name:"Common Pavimento" }
];

const DEFAULT_STATE = {
  people:[
    { id:"dikshant", name:"Dikshant", color:"#0f957f" },
    { id:"edoardo", name:"Edoardo", color:"#c2552d" },
    { id:"luciana", name:"Luciana", color:"#5b52d6" },
    { id:"luka", name:"Luka", color:"#e6a100" }
  ],
  areas: FIXED_AREAS,
  weekAssignments:{},
  done:{}
};

const state = structuredClone(DEFAULT_STATE);

const ANCHOR = Date.UTC(2024,0,1); // Monday
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

let saveTimer;
let view = "week";
let cursorDate = startOfDay(new Date());

const els = {
  peopleList:document.querySelector("#peopleList"),
  weekView:document.querySelector("#weekView"),
  monthView:document.querySelector("#monthView"),
  dateTitle:document.querySelector("#dateTitle"),
  syncText:document.querySelector("#syncText"),
  weekTab:document.querySelector("#weekTab"),
  monthTab:document.querySelector("#monthTab"),
  shareLink:document.querySelector("#shareLink"),
  resetScheduleBtn:document.querySelector("#resetScheduleBtn")
};

init();

async function init(){
  els.shareLink.value = location.origin + location.pathname;

  document.querySelector("#copyBtn").onclick = async () => {
    await navigator.clipboard.writeText(location.origin + location.pathname);
    alert("Link copied");
  };

  els.weekTab.onclick = () => setView("week");
  els.monthTab.onclick = () => setView("month");

  document.querySelector("#prevBtn").onclick = () => {
    cursorDate = view === "week"
      ? addDays(cursorDate,-7)
      : addMonths(cursorDate,-1);
    renderCalendar();
  };

  document.querySelector("#nextBtn").onclick = () => {
    cursorDate = view === "week"
      ? addDays(cursorDate,7)
      : addMonths(cursorDate,1);
    renderCalendar();
  };

  document.querySelector("#todayBtn").onclick = () => {
    cursorDate = startOfDay(new Date());
    renderCalendar();
  };

  els.resetScheduleBtn.onclick = () => {
    if(confirm("Clear all manual swaps and restore the automatic cycle?")){
      state.weekAssignments = {};
      save();
      renderCalendar();
    }
  };

  render();
  await initFirebase();
}

function setView(nextView){
  view = nextView;
  els.weekTab.classList.toggle("active", view === "week");
  els.monthTab.classList.toggle("active", view === "month");
  els.weekView.classList.toggle("hidden", view !== "week");
  els.monthView.classList.toggle("hidden", view !== "month");
  renderCalendar();
}

async function initFirebase(){
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "cleaningCalendars", "main-calendar");

    els.syncText.textContent = "Live sync ON";

    window.saveRemote = async () => {
      await setDoc(docRef, structuredClone(state), { merge:false });
    };

    onSnapshot(
      docRef,
      snapshot => {
        if (snapshot.metadata.hasPendingWrites) return; // ignore our own local write echo
        if (snapshot.exists()) {
          const remoteData = snapshot.data();
          state.weekAssignments = remoteData.weekAssignments || {};
          state.done = remoteData.done || {};
          
          if(remoteData.people && remoteData.people.length > 0){
            state.people = remoteData.people;
          }
          state.areas = FIXED_AREAS;

          if(els.peopleList.contains(document.activeElement)) renderCalendar();
          else render();
        } else {
          window.saveRemote();
        }
      },
      error => {
        console.error(error);
        els.syncText.textContent = "Sync failed";
      }
    );

  }catch(error){
    console.error(error);
    els.syncText.textContent = "Firebase failed";
  }
}

function render(){
  renderPeople();
  renderCalendar();
}

function renderPeople(){
  els.peopleList.innerHTML = "";

  state.people.forEach(person => {
    const row = document.createElement("div");
    row.className = "person";
    row.style.setProperty("--person-color", person.color);

    row.innerHTML = `
      <div class="dot"></div>
      <input value="${escapeHtml(person.name)}" />
      <input type="color" value="${person.color}" />
    `;

    const nameInput = row.querySelector("input:not([type=color])");
    const colorInput = row.querySelector("input[type=color]");

    nameInput.oninput = () => {
      person.name = nameInput.value.trim() || "Roommate";
      save();
      renderCalendar();
    };

    colorInput.oninput = () => {
      person.color = colorInput.value;
      row.style.setProperty("--person-color", person.color);
      save();
      renderCalendar();
    };

    els.peopleList.appendChild(row);
  });
}

function renderCalendar(){
  if(view === "week"){
    renderWeek();
  }else{
    renderMonth();
  }
}

function renderWeek(){
  els.monthView.classList.add("hidden");
  els.weekView.classList.remove("hidden");
  els.dateTitle.textContent = formatWeekTitle(cursorDate);

  const weekStart = startOfWeek(cursorDate);
  const todayKey = dateKey(new Date());
  const isCurrent = dateKey(weekStart) === dateKey(startOfWeek(new Date()));

  const table = document.createElement("div");
  table.className = "week-table";
  table.innerHTML = `<div class="corner"></div>`;

  for(let i=0;i<7;i++){
    const day = addDays(weekStart,i);
    const head = document.createElement("div");
    head.className = "day-head" + (dateKey(day) === todayKey ? " today" : "");
    head.innerHTML = `${weekdayShort(day)}<br><strong>${day.getDate()}</strong>`;
    table.appendChild(head);
  }

  state.areas.forEach(area => {
    const label = document.createElement("div");
    label.className = "area-label";
    label.textContent = area.name;
    table.appendChild(label);

    const cell = buildSlot(area, cursorDate, "span-cell" + (isCurrent ? " current" : ""));
    table.appendChild(cell);
  });

  els.weekView.innerHTML = "";
  els.weekView.appendChild(table);
}

function renderMonth(){
  els.weekView.classList.add("hidden");
  els.monthView.classList.remove("hidden");
  els.dateTitle.textContent = formatMonthTitle(cursorDate);

  const first = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), 1);
  const last = new Date(cursorDate.getFullYear(), cursorDate.getMonth()+1, 0);
  const currentKey = dateKey(startOfWeek(new Date()));
  const fmt = d => `${d.getDate()} ${new Intl.DateTimeFormat(undefined,{month:"short"}).format(d)}`;

  const grid = document.createElement("div");
  grid.className = "month-table";
  grid.style.gridTemplateColumns = `130px repeat(${state.areas.length}, minmax(110px,1fr))`;
  grid.innerHTML = `<div class="corner">Week</div>` +
    state.areas.map(a => `<div class="day-head">${escapeHtml(a.name)}</div>`).join("");

  for(let ws = startOfWeek(first); ws <= last; ws = addDays(ws,7)){
    const current = dateKey(ws) === currentKey;
    const label = document.createElement("div");
    label.className = "area-label" + (current ? " current" : "");
    label.textContent = `${fmt(ws)} – ${fmt(addDays(ws,6))}`;
    grid.appendChild(label);

    state.areas.forEach(area => {
      const cell = buildSlot(area, ws, current ? "current" : "");
      grid.appendChild(cell);
    });
  }

  els.monthView.innerHTML = "";
  els.monthView.appendChild(grid);
}

// ---- Weekly rotation ----
// Tasks are assigned per week (Mon-Sun). The assignment shifts by one step every week,
// so with 4 people and 4 tasks everyone gets a different task and the cycle repeats every 4 weeks.
function weekIndex(dateObj){
  const s = startOfWeek(dateObj);
  return Math.round((Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()) - ANCHOR) / WEEK_MS);
}

function autoAssignment(dateObj){
  const n = state.people.length;
  const w = weekIndex(dateObj);
  const out = {};
  if(!n) return out;
  state.areas.forEach((area,i) => {
    out[area.id] = state.people[(((i + w) % n) + n) % n].id;
  });
  return out;
}

function getWeekAssignment(dateObj){
  const manual = state.weekAssignments[dateKey(startOfWeek(dateObj))] || {};
  return { ...autoAssignment(dateObj), ...manual };
}

function getAssignedPerson(areaId, dateObj){
  const id = getWeekAssignment(dateObj)[areaId];
  return state.people.find(p => p.id === id) || null;
}

function isDone(areaId, dateObj){
  return !!(state.done[dateKey(startOfWeek(dateObj))] || {})[areaId];
}

function toggleDone(areaId, dateObj){
  const key = dateKey(startOfWeek(dateObj));
  const week = state.done[key] || (state.done[key] = {});
  if(week[areaId]) delete week[areaId]; else week[areaId] = true;
  if(Object.keys(week).length === 0) delete state.done[key];
  save();
  renderCalendar();
}

// One slot = assigned person (tap to change) + done / not done toggle
function buildSlot(area, dateObj, extraClass){
  const person = getAssignedPerson(area.id, dateObj);
  const done = isDone(area.id, dateObj);
  const cell = document.createElement("div");
  cell.className = ("cell " + extraClass + (done ? " is-done" : "")).trim();
  if(!person) return cell;

  const pill = document.createElement("button");
  pill.type = "button";
  pill.className = "pill-btn";
  pill.title = "Tap to change person";
  pill.innerHTML = `<span class="assignment" style="--person-color:${person.color}"><span class="mini-dot"></span>${escapeHtml(person.name)}</span>`;
  pill.onclick = () => cycleAssignment(area.id, dateObj);

  const tick = document.createElement("button");
  tick.type = "button";
  tick.className = "done-btn" + (done ? " on" : "");
  tick.textContent = done ? "✓ Done" : "Not done";
  tick.onclick = () => toggleDone(area.id, dateObj);

  cell.append(pill, tick);
  return cell;
}

// Tap = next person; the person who already had that slot swaps tasks with you (no duplicates)
function cycleAssignment(areaId, dateObj){
  const cur = getWeekAssignment(dateObj);
  const idx = state.people.findIndex(p => p.id === cur[areaId]);
  const next = state.people[(idx + 1) % state.people.length];
  const other = state.areas.find(a => a.id !== areaId && cur[a.id] === next.id);

  const updated = { ...cur, [areaId]: next.id };
  if(other) updated[other.id] = cur[areaId];

  state.weekAssignments[dateKey(startOfWeek(dateObj))] = updated;

  // A new person on a slot means it is not done yet
  const doneWeek = state.done[dateKey(startOfWeek(dateObj))];
  if(doneWeek){
    delete doneWeek[areaId];
    if(other) delete doneWeek[other.id];
    if(Object.keys(doneWeek).length === 0) delete state.done[dateKey(startOfWeek(dateObj))];
  }
  save();
  renderCalendar();
}

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      if(window.saveRemote) await window.saveRemote();
    }catch(e){
      console.error(e);
      els.syncText.textContent = "Sync failed";
    }
  }, 300);
}

function startOfDay(date){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function startOfWeek(date){
  const d = startOfDay(date);
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d;
}

function addDays(date,days){
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addMonths(date,months){
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}

function dateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function parseDateKey(str){
  const parts = str.split("-");
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}

function weekdayShort(date){
  return new Intl.DateTimeFormat(undefined,{ weekday:"short" }).format(date);
}

function formatWeekTitle(date){
  const start = startOfWeek(date);
  const end = addDays(start,6);

  const sameMonth = start.getMonth() === end.getMonth();
  const monthA = new Intl.DateTimeFormat(undefined,{ month:"short" }).format(start);
  const monthB = new Intl.DateTimeFormat(undefined,{ month:"short" }).format(end);

  return sameMonth
    ? `${monthA} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`
    : `${monthA} ${start.getDate()} – ${monthB} ${end.getDate()}, ${end.getFullYear()}`;
}

function formatMonthTitle(date){
  return new Intl.DateTimeFormat(undefined,{
    month:"long",
    year:"numeric"
  }).format(date);
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>
