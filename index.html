<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apartment Cleaning Calendar</title>

<style>
:root{
  --bg:#111315;
  --panel:#1b1d1f;
  --panel2:#242729;
  --panel3:#303335;
  --text:#f4f1ea;
  --muted:#aaa49a;
  --line:#3a3d40;
  --accent:#78a6ff;
  --radius:18px;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(120,166,255,.14), transparent 34rem),
    radial-gradient(circle at bottom right, rgba(56,189,148,.10), transparent 30rem),
    var(--bg);
  color:var(--text);
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:min(1420px, calc(100vw - 28px));
  margin:auto;
  padding:28px 0 42px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.title h1{
  margin:0;
  font-size:clamp(2rem,4vw,3.25rem);
  line-height:.95;
  letter-spacing:-.06em;
}

.title p{
  margin:12px 0 0;
  color:var(--muted);
}

.card{
  background:rgba(27,29,31,.84);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.sync-card{
  min-width:305px;
  padding:14px;
}

.status{
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--muted);
}

.pulse{
  width:10px;
  height:10px;
  border-radius:999px;
  background:#38bd94;
  box-shadow:0 0 0 5px rgba(56,189,148,.12);
}

.share-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.share-row input{
  width:100%;
  min-width:0;
  background:#151719;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--muted);
  padding:10px 12px;
}

button{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}

button:hover{
  background:#2b2f32;
  border-color:#555b61;
}

.grid{
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:18px;
  align-items:start;
}

.card-header{
  padding:18px;
  border-bottom:1px solid var(--line);
}

.card-header h2{
  margin:0;
}

.card-header small{
  display:block;
  margin-top:8px;
  color:var(--muted);
}

.section{
  padding:18px;
}

.people-list,
.area-list{
  display:grid;
  gap:10px;
}

.person,
.area-chip{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  padding:10px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
}

.dot{
  width:13px;
  height:13px;
  border-radius:999px;
  background:var(--person-color);
}

.person input,
.area-chip input{
  width:100%;
  background:transparent;
  border:0;
  color:var(--text);
  outline:0;
}

.delete-btn{
  width:30px;
  height:30px;
  padding:0;
}

.primary-btn{
  width:100%;
  margin-top:12px;
  font-weight:800;
  background:linear-gradient(135deg, rgba(120,166,255,.34), rgba(56,189,148,.24));
  border-color:rgba(120,166,255,.45);
}

.calendar-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}

.tabs{
  display:flex;
  background:#151719;
  border:1px solid var(--line);
  border-radius:14px;
  padding:4px;
}

.tab-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 14px;
}

.tab-btn.active{
  background:var(--panel3);
  color:var(--text);
}

#dateTitle{
  font-weight:900;
  letter-spacing:-.03em;
  font-size:1.25rem;
}

.calendar-shell{
  padding:16px;
  overflow-x:auto;
}

.week-table{
  display:grid;
  grid-template-columns:116px repeat(7, minmax(80px,1fr));
  gap:6px;
  min-width:760px;
}

.corner,
.day-head,
.area-label{
  min-height:42px;
  display:flex;
  align-items:center;
  color:var(--muted);
  font-weight:800;
  font-size:.84rem;
}

.day-head{
  justify-content:center;
  text-align:center;
}

.day-head strong{
  color:var(--text);
  font-size:.95rem;
}

.area-label{
  justify-content:flex-start;
  color:var(--text);
  padding-left:4px;
}

.cell{
  min-height:58px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.assignment{
  display:flex;
  gap:8px;
  align-items:center;
  background:rgba(0,0,0,.22);
  padding:6px 9px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:900;
}

.mini-dot{
  width:9px;
  height:9px;
  border-radius:999px;
  background:var(--person-color);
}

.month-grid{
  display:grid;
  grid-template-columns:repeat(7, minmax(135px,1fr));
  gap:10px;
  min-width:980px;
}

.month-day{
  min-height:165px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel2);
  padding:10px;
}

.month-clickable{
  width:100%;
  margin-bottom:7px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.16);
  border-radius:10px;
  padding:7px 8px;
  color:var(--muted);
  text-align:left;
  display:grid;
  grid-template-columns:9px minmax(0,1fr);
  gap:7px;
  align-items:center;
  font-size:.78rem;
  line-height:1.2;
}

.month-clickable span:last-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.month-weekday{
  text-align:center;
  color:var(--muted);
  font-weight:900;
  font-size:.8rem;
  padding-bottom:8px;
}

.hidden{
  display:none!important;
}

@media(max-width:940px){
  .grid{
    grid-template-columns:1fr;
  }

  .sync-card{
    width:100%;
  }
}

@media(max-width:690px){
  .app{
    width:min(100% - 18px,1180px);
    padding-top:16px;
  }

  .title h1{
    font-size:2.25rem;
  }

  .calendar-toolbar{
    align-items:flex-start;
  }

  #dateTitle{
    width:100%;
    order:3;
  }
}
</style>
</head>

<body>

<main class="app">

<header class="topbar">
  <div class="title">
    <h1>Cleaning Calendar</h1>
    <p>Tap tasks to cycle roommates. Everyone sees updates instantly.</p>
  </div>

  <aside class="card sync-card">
    <div class="status">
      <div class="pulse"></div>
      <div id="syncText">Connecting...</div>
    </div>

    <div class="share-row">
      <input id="shareLink" readonly />
      <button id="copyBtn" type="button">Copy</button>
    </div>
  </aside>
</header>

<section class="grid">

<aside class="card">
  <div class="card-header">
    <h2>Roommates</h2>
    <small>Rename people and colors</small>
  </div>

  <div class="section">
    <div id="peopleList" class="people-list"></div>
  </div>

  <div class="card-header">
    <h2>Cleaning Areas</h2>
    <small>Add/remove house areas</small>
  </div>

  <div class="section">
    <div id="areaList" class="area-list"></div>
    <button id="addAreaBtn" class="primary-btn" type="button">+ Add Area</button>
  </div>
</aside>

<section class="card">
  <div class="calendar-toolbar">
    <div class="tabs">
      <button id="weekTab" class="tab-btn active" type="button">Week</button>
      <button id="monthTab" class="tab-btn" type="button">Month</button>
    </div>

    <div id="dateTitle"></div>

    <div>
      <button id="prevBtn" type="button">‹</button>
      <button id="todayBtn" type="button">Today</button>
      <button id="nextBtn" type="button">›</button>
    </div>
  </div>

  <div class="calendar-shell">
    <div id="weekView"></div>
    <div id="monthView" class="hidden"></div>
  </div>
</section>

</section>

</main>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyDzlckuFw-Z7ORToYQBctEjeR4UnOQAsAs",
  authDomain: "roma-cleaning-calendar.firebaseapp.com",
  projectId: "roma-cleaning-calendar",
  storageBucket: "roma-cleaning-calendar.firebasestorage.app",
  messagingSenderId: "499659793437",
  appId: "1:499659793437:web:8d969bddd2992f1791d2f4",
  measurementId: "G-K38Q24H8RK"
};

const DEFAULT_STATE = {
  people:[
    { id:"dikshant", name:"Dikshant", color:"#0f957f" },
    { id:"edoardo", name:"Edoardo", color:"#c2552d" },
    { id:"luciana", name:"Luciana", color:"#5b52d6" },
    { id:"luka", name:"Luka", color:"#e6a100" }
  ],
  areas:[
    { id:"kitchen", name:"Kitchen" },
    { id:"bagno_con_vasca", name:"Bagno con vasca" },
    { id:"normale_bagno", name:"Bagno Normale" },
    { id:"common_pavimento", name:"Common Pavimento" }
  ],
  assignments:{}
};

const state = structuredClone(DEFAULT_STATE);

let view = "week";
let cursorDate = startOfDay(new Date());

const els = {
  peopleList:document.querySelector("#peopleList"),
  areaList:document.querySelector("#areaList"),
  weekView:document.querySelector("#weekView"),
  monthView:document.querySelector("#monthView"),
  dateTitle:document.querySelector("#dateTitle"),
  syncText:document.querySelector("#syncText"),
  weekTab:document.querySelector("#weekTab"),
  monthTab:document.querySelector("#monthTab"),
  shareLink:document.querySelector("#shareLink")
};

init();

async function init(){
  els.shareLink.value = location.origin + location.pathname;

  document.querySelector("#copyBtn").onclick = async () => {
    await navigator.clipboard.writeText(location.origin + location.pathname);
    alert("Link copied");
  };

  els.weekTab.onclick = () => setView("week");
  els.monthTab.onclick = () => setView("month");

  document.querySelector("#prevBtn").onclick = () => {
    cursorDate = view === "week"
      ? addDays(cursorDate,-7)
      : addMonths(cursorDate,-1);

    renderCalendar();
  };

  document.querySelector("#nextBtn").onclick = () => {
    cursorDate = view === "week"
      ? addDays(cursorDate,7)
      : addMonths(cursorDate,1);

    renderCalendar();
  };

  document.querySelector("#todayBtn").onclick = () => {
    cursorDate = startOfDay(new Date());
    renderCalendar();
  };

  document.querySelector("#addAreaBtn").onclick = addArea;

  render();
  await initFirebase();
}

function setView(nextView){
  view = nextView;

  els.weekTab.classList.toggle("active", view === "week");
  els.monthTab.classList.toggle("active", view === "month");

  els.weekView.classList.toggle("hidden", view !== "week");
  els.monthView.classList.toggle("hidden", view !== "month");

  renderCalendar();
}

async function initFirebase(){
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "cleaningCalendars", "main-calendar");

    els.syncText.textContent = "Live sync ON";

    window.saveRemote = async () => {
      await setDoc(docRef, structuredClone(state), { merge:false });
    };


    onSnapshot(
      docRef,
      snapshot => {
        if (snapshot.exists()) {
          const remoteData = snapshot.data();
          
          // 1. Database se assignments le lo taaki purana schedule na ude
          state.assignments = remoteData.assignments || {};

          // 2. Roommates aur Areas database ke mat lo, HTML wale hi rakho!
          // Agar database ka data alag hai, toh HTML ke mutabiq database ko sync/update kar do
          const needsUpdate = 
            JSON.stringify(remoteData.people) !== JSON.stringify(state.people) ||
            JSON.stringify(remoteData.areas) !== JSON.stringify(state.areas);

          if (needsUpdate) {
            window.saveRemote(); // Database ko turant nayi HTML ke mutabiq overwrite kar dega
          }

          render();
        } else {
          window.saveRemote();
        }
      },
      error => {
        console.error(error);
        els.syncText.textContent = "Sync failed";
      }
    );

  }catch(error){
    console.error(error);
    els.syncText.textContent = "Firebase failed";
  }
}

function render(){
  renderPeople();
  renderAreas();
  renderCalendar();
}

function renderPeople(){
  els.peopleList.innerHTML = "";

  state.people.forEach(person => {
    const row = document.createElement("div");
    row.className = "person";
    row.style.setProperty("--person-color", person.color);

    row.innerHTML = `
      <div class="dot"></div>
      <input value="${escapeHtml(person.name)}" />
      <input type="color" value="${person.color}" />
    `;

    const nameInput = row.querySelector("input:not([type=color])");
    const colorInput = row.querySelector("input[type=color]");

    nameInput.oninput = () => {
      person.name = nameInput.value.trim() || "Roommate";
      save();
      renderCalendar();
    };

    colorInput.oninput = () => {
      person.color = colorInput.value;
      save();
      render();
    };

    els.peopleList.appendChild(row);
  });
}

function renderAreas(){
  els.areaList.innerHTML = "";

  state.areas.forEach(area => {
    const row = document.createElement("div");
    row.className = "area-chip";

    row.innerHTML = `
      <div style="width:13px;height:13px;border-radius:999px;background:#5f656b"></div>
      <input value="${escapeHtml(area.name)}" />
      <button class="delete-btn" type="button">×</button>
    `;

    const input = row.querySelector("input");
    const button = row.querySelector("button");

    input.oninput = () => {
      area.name = input.value.trim() || "New Area";
      save();
      renderCalendar();
    };

    button.onclick = () => {
      if(!confirm(`Delete "${area.name}"?`)) return;

      state.areas = state.areas.filter(a => a.id !== area.id);
      Object.values(state.assignments).forEach(day => delete day[area.id]);

      save();
      render();
    };

    els.areaList.appendChild(row);
  });
}

function renderCalendar(){
  if(view === "week"){
    renderWeek();
  }else{
    renderMonth();
  }
}

function renderWeek(){
  els.monthView.classList.add("hidden");
  els.weekView.classList.remove("hidden");

  els.dateTitle.textContent = formatWeekTitle(cursorDate);

  const weekStart = startOfWeek(cursorDate);
  const days = Array.from({ length:7 }, (_,i) => addDays(weekStart,i));

  const table = document.createElement("div");
  table.className = "week-table";
  table.innerHTML = `<div class="corner"></div>`;

  days.forEach(day => {
    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = `${weekdayShort(day)}<br><strong>${day.getDate()}</strong>`;
    table.appendChild(head);
  });

  state.areas.forEach(area => {
    const label = document.createElement("div");
    label.className = "area-label";
    label.textContent = area.name;
    table.appendChild(label);

    days.forEach(day => {
      const key = dateKey(day);
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.type = "button";

      fillCell(cell, key, area.id);

      cell.onclick = () => cycleAssignment(key, area.id);
      table.appendChild(cell);
    });
  });

  els.weekView.innerHTML = "";
  els.weekView.appendChild(table);
}

function renderMonth(){
  els.weekView.classList.add("hidden");
  els.monthView.classList.remove("hidden");

  els.dateTitle.textContent = formatMonthTitle(cursorDate);

  const first = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), 1);
  const gridStart = startOfWeek(first);
  const days = Array.from({ length:42 }, (_,i) => addDays(gridStart,i));

  const grid = document.createElement("div");
  grid.className = "month-grid";

  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(day => {
    const el = document.createElement("div");
    el.className = "month-weekday";
    el.textContent = day;
    grid.appendChild(el);
  });

  days.forEach(day => {
    const key = dateKey(day);
    const tile = document.createElement("div");
    tile.className = "month-day";

    if(day.getMonth() !== cursorDate.getMonth()){
      tile.classList.add("outside");
    }

    tile.innerHTML = `<div class="day-number">${day.getDate()}</div>`;

    state.areas.forEach(area => {
      const person = getAssignedPerson(key, area.id);

      const item = document.createElement("button");
      item.type = "button";
      item.className = "month-clickable";

      item.innerHTML = `
        <span style="width:8px;height:8px;border-radius:999px;background:${person ? person.color : "#5f656b"}"></span>
        <span>${escapeHtml(area.name)} · ${person ? escapeHtml(person.name) : "Unassigned"}</span>
      `;

      item.onclick = () => cycleAssignment(key, area.id);

      tile.appendChild(item);
    });

    grid.appendChild(tile);
  });

  els.monthView.innerHTML = "";
  els.monthView.appendChild(grid);
}

function fillCell(cell,key,areaId){
  const person = getAssignedPerson(key,areaId);

  if(!person){
    cell.innerHTML = "";
    return;
  }

  cell.innerHTML = `
    <div class="assignment" style="--person-color:${person.color}">
      <div class="mini-dot"></div>
      ${escapeHtml(person.name)}
    </div>
  `;
}

function cycleAssignment(key,areaId){
  if(!state.assignments[key]){
    state.assignments[key] = {};
  }

  const currentId = state.assignments[key][areaId];
  const index = state.people.findIndex(p => p.id === currentId);
  const next = state.people[index + 1];

  if(next){
    state.assignments[key][areaId] = next.id;
  }else{
    delete state.assignments[key][areaId];
  }

  if(Object.keys(state.assignments[key]).length === 0){
    delete state.assignments[key];
  }

  save();
  renderCalendar();
}

function getAssignedPerson(key,areaId){
  const personId = state.assignments[key]?.[areaId];
  return state.people.find(p => p.id === personId) || null;
}

function addArea(){
  state.areas.push({
    id:crypto.randomUUID(),
    name:"New Area"
  });

  save();
  render();
}

async function save(){
  if(window.saveRemote){
    await window.saveRemote();
  }
}

function startOfDay(date){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function startOfWeek(date){
  const d = startOfDay(date);
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d;
}

function addDays(date,days){
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addMonths(date,months){
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}

function dateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function weekdayShort(date){
  return new Intl.DateTimeFormat(undefined,{ weekday:"short" }).format(date);
}

function formatWeekTitle(date){
  const start = startOfWeek(date);
  const end = addDays(start,6);

  const sameMonth = start.getMonth() === end.getMonth();
  const monthA = new Intl.DateTimeFormat(undefined,{ month:"short" }).format(start);
  const monthB = new Intl.DateTimeFormat(undefined,{ month:"short" }).format(end);

  return sameMonth
    ? `${monthA} ${start.getDate()}–${end.getDate()}, ${end.getFullYear()}`
    : `${monthA} ${start.getDate()} – ${monthB} ${end.getDate()}, ${end.getFullYear()}`;
}

function formatMonthTitle(date){
  return new Intl.DateTimeFormat(undefined,{
    month:"long",
    year:"numeric"
  }).format(date);
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
